<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditor Conciliador — Aviso</title>
<style>
  :root { color-scheme: light dark;
    --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --azul:#2a78d6;
    --amar:#fab219; --ring:rgba(11,11,11,.10); }
  @media (prefers-color-scheme: dark) { :root {
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --azul:#3987e5;
    --ring:rgba(255,255,255,.10); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--plane); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5;
    display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
  .card { max-width:520px; background:var(--surface); border:1px solid var(--ring);
    border-radius:14px; padding:30px 32px; }
  .icono { font-size:34px; }
  h1 { font-size:19px; margin:12px 0 8px; }
  p { color:var(--ink2); font-size:14px; margin:0 0 22px; }
  a { display:inline-block; font-size:14px; font-weight:650; text-decoration:none;
    padding:11px 22px; border-radius:10px; background:var(--azul); color:#fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="icono">⚠️</div>
    <h1>{{ titulo }}</h1>
    <p>{{ detalle }}</p>
    <a href="/">← Volver a cargar</a>
  </div>
</body>
</html>
